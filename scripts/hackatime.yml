name: Update Hackatime Stats

on:
  schedule:
    # Every 12 hours, on the hour
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate activity panel
        run: python scripts/update_hackatime.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/panel-activity.svg
          git diff --staged --quiet || git commit -m "Update Hackatime panel"
          git pull --rebase
          git push

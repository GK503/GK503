<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04040f"/>
      <stop offset="0.55" stop-color="#0a0a1f"/>
      <stop offset="1" stop-color="#0d0d2b"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#00ffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00ffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ff00ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="960" height="300" fill="url(#bgGrad)"/>
  <rect width="960" height="300" fill="url(#coreGlow)"/>
  <rect width="960" height="300" fill="url(#magentaGlow)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="30" r="1.6"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="28" r="1.2"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="46" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="22" r="1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="66" r="1.5"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="34" r="1"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="82" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- upper neon grid -->
  <g stroke="#00ffff">
    <g stroke-opacity="0.08">
      <path d="M80 0 V150"/>
      <path d="M160 0 V150"/>
      <path d="M240 0 V150"/>
      <path d="M320 0 V150"/>
      <path d="M400 0 V150"/>
      <path d="M480 0 V150"/>
      <path d="M560 0 V150"/>
      <path d="M640 0 V150"/>
      <path d="M720 0 V150"/>
      <path d="M800 0 V150"/>
      <path d="M880 0 V150"/>
    </g>
    <g transform="translate(0,0)">
      <path d="M0 30 H960" stroke-opacity="0.10"/>
      <path d="M0 60 H960" stroke-opacity="0.06"/>
      <path d="M0 90 H960" stroke-opacity="0.04"/>
      <path d="M0 120 H960" stroke-opacity="0.03"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 30" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- perspective floor -->
  <polygon points="0,300 480,190 960,300" fill="#00ffff" fill-opacity="0.05"/>
  <g stroke="#ff00ff" stroke-opacity="0.22">
    <path d="M480 190 L60 300" fill="none"/>
    <path d="M480 190 L190 300" fill="none"/>
    <path d="M480 190 L320 300" fill="none"/>
    <path d="M480 190 L640 300" fill="none"/>
    <path d="M480 190 L770 300" fill="none"/>
    <path d="M480 190 L900 300" fill="none"/>
  </g>
  <g stroke="#00ffff">
    <g transform="translate(0,0)">
      <path d="M140 246 H820" stroke-opacity="0.16"/>
      <path d="M120 224 H840" stroke-opacity="0.14"/>
      <path d="M100 204 H860" stroke-opacity="0.12"/>
      <path d="M80 200 H880" stroke-opacity="0" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 22" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- scanline sweep -->
  <g>
    <rect x="0" y="-10" width="960" height="3" fill="#00ffff" fill-opacity="0.35">
      <animate attributeName="y" from="-10" to="310" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="-10" width="960" height="10" fill="#00ffff" fill-opacity="0.06">
      <animate attributeName="y" from="-14" to="310" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#00ffff" stroke-width="3" fill="none">
    <path d="M14 52 V26 Q14 14 26 14 H52"/>
    <path d="M908 52 V26 Q908 14 896 14 H870"/>
    <path d="M14 250 V274 Q14 286 26 286 H52"/>
    <path d="M908 250 V274 Q908 286 896 286 H870"/>
  </g>

  <!-- title -->
  <g filter="url(#neon)">
    <text x="480" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="66" fill="#00ffff" letter-spacing="14">
      GK503
      <animate attributeName="opacity" values="1;0.9;1;0.95;1;0.88;1" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- subtitle -->
  <text x="480" y="196" text-anchor="middle" font-family="'Courier New', monospace" font-size="17" fill="#ff00ff" letter-spacing="9">
    JAVA MAGE // FULL STACK // UNREAL ENGINE
    <animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/>
  </text>

  <!-- status line -->
  <text x="480" y="226" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#39ff14" letter-spacing="5">
    &#9679; SYSTEM ONLINE // PROFILE LOADING COMPLETE
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- meta text -->
  <text x="20" y="292" font-family="'Courier New', monospace" font-size="11" fill="#4d4d6b" letter-spacing="2">
    GK503 PROFILE // BUILD 2.4.2
  </text>
  <text x="940" y="292" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#4d4d6b" letter-spacing="2">
    ALL SYSTEMS NOMINAL
  </text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="GK503 - twilight sky with drifting sakura petals" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a6b"/>
      <stop offset="0.35" stop-color="#8a5cb0"/>
      <stop offset="0.65" stop-color="#f08bab"/>
      <stop offset="1" stop-color="#ffc59a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffd3a8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb3a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7ef"/>
      <stop offset="0.5" stop-color="#ffe0ec"/>
      <stop offset="1" stop-color="#e6dcff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0.1  0 0.6 0 0 0.05  0 0 0.8 0 0.1  0 0 0 0.9 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
    <path id="petal" d="M0 0 C6 -6 14 -2 12 6 C10 12 2 12 0 6 C-1 3 -1 1 0 0 Z" fill="#ffd6e4"/>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>

  <!-- sun glow -->
  <circle cx="760" cy="235" r="150" fill="url(#sun)">
    <animate attributeName="r" values="145;158;145" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="78" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="30" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="58" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="26" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="66" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="34" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="84" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- bokeh -->
  <g filter="url(#soft)" fill="#fff" opacity="0.28">
    <circle cx="140" cy="210" r="14"><animate attributeName="cy" values="210;196;210" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="250" r="9"><animate attributeName="cy" values="250;240;250" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="150" r="12"><animate attributeName="cy" values="150;138;150" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="228" r="7"><animate attributeName="cy" values="228;218;228" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- layered hills -->
  <path d="M0 250 C160 215 300 265 470 240 C640 215 800 262 1000 232 L1000 320 L0 320 Z" fill="#b0679f" opacity="0.65"/>
  <path d="M0 280 C180 250 340 296 520 272 C700 248 860 292 1000 268 L1000 320 L0 320 Z" fill="#5e3a86"/>
  <path d="M0 305 C200 288 380 314 560 300 C740 286 880 312 1000 298 L1000 320 L0 320 Z" fill="#2f1f55"/>

  <!-- title -->
  <g style="font-family:'Nunito','Quicksand','Varela Round','Trebuchet MS',ui-rounded,'Segoe UI',sans-serif" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
      <text x="500" y="158" font-size="104" font-weight="800" letter-spacing="4" fill="url(#title)" filter="url(#glow)">GK503</text>
      <text x="500" y="204" font-size="21" font-weight="600" letter-spacing="1.5" fill="#fff0f5" opacity="0.92">Java, Python &amp; C++ · building little worlds</text>
    </g>
  </g>

  <!-- falling sakura petals -->
  <g>
    <g><animateTransform attributeName="transform" type="translate" values="80 -20;150 340" dur="11s" begin="0s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="220 -20;300 340" dur="13s" begin="-4s" repeatCount="indefinite"/>
      <use xlink:href="#petal" transform="scale(0.8)"><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="6s" repeatCount="indefinite" additive="sum"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="360 -20;420 340" dur="10s" begin="-7s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="30;390" dur="4.5s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="520 -20;610 340" dur="14s" begin="-2s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="660 -20;720 340" dur="12s" begin="-9s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="5.5s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="800 -20;880 340" dur="11.5s" begin="-5s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="60;420" dur="6s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="930 -20;960 340" dur="15s" begin="-11s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/></use></g>
    <g><animateTransform attributeName="transform" type="translate" values="30 -20;60 340" dur="16s" begin="-13s" repeatCount="indefinite"/>
      <use xlink:href="#petal"><animateTransform attributeName="transform" type="rotate" values="0;-360" dur="7s" repeatCount="indefinite"/></use></g>
  </g>
</svg>

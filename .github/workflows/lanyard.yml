name: Update Lanyard Card

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Lanyard SVG
        run: python scripts/update_lanyard.py
      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add dist/lanyard.svg
          git diff --quiet || (git commit -m "update lanyard card" && git push)
